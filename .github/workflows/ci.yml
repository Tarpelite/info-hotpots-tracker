name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: data (offline tests on fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest==8.3.4

      - name: Run offline tests
        run: python -m pytest pipeline/tests -q

      - name: Run student scripts and slim builder on fixture
        env:
          RAW: pipeline/tests/fixtures/raw_mini
          OUT: ${{ runner.temp }}/fixture-out
        run: |
          python scripts/import_snapshot.py \
            --snapshot "$RAW/团队快照/team_snapshot_20261005.json" \
            --news-data "$RAW/news-data" \
            --output "$OUT" \
            --location-query off
          python scripts/validate_snapshot.py --data "$OUT/data.json" --output "$OUT/validation"
          python scripts/build_map.py --data "$OUT/data.json" --output "$OUT/map"
          python pipeline/site/build_site_data.py --input "$OUT/data.json" --output "$OUT/site/data.json"

  web:
    name: web (build frontend)
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist/
          if-no-files-found: error

  publish:
    name: publish (site branch)
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-site
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site-out

      - name: Push orphan site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site-out
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site
